<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1060" viewBox="0 0 1560 1060" role="img"><title>05 / Read first, restore only when useful</title><desc>Storyboard. Returning to the Inbox and returning along the navigation trail are explicit choices.</desc><rect width="100%" height="100%" fill="#0B101A"/>
<text x="36" y="24" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#EBC575">05 / Read first, restore only when useful</text>
<text x="36" y="72" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">Storyboard. Returning to the Inbox and returning along the navigation trail are explicit choices.</text>
<rect x="36" y="130" width="718" height="355" fill="#111C2B" stroke="#34445C" stroke-width="1"/>
<rect x="806" y="130" width="718" height="355" fill="#111C2B" stroke="#34445C" stroke-width="1"/>
<rect x="36" y="570" width="718" height="355" fill="#111C2B" stroke="#34445C" stroke-width="1"/>
<rect x="806" y="570" width="718" height="355" fill="#111C2B" stroke="#34445C" stroke-width="1"/>
<text x="58" y="150" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#EBC575">1  Locate the past run</text>
<text x="828" y="150" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#EBC575">2  Read without restoring</text>
<text x="58" y="590" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#EBC575">3  Choose a visibility action</text>
<text x="828" y="590" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#EBC575">4  Return with your place intact</text>
<text x="58" y="202" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Inbox | [ History ]</text>
<text x="58" y="229" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Source: This machine</text>
<text x="58" y="256" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">in:local name:parser*</text>
<text x="58" y="283" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7"></text>
<text x="58" y="310" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">&gt; parser-cleanup     DONE dismissed</text>
<text x="58" y="337" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">  parser-tests       DONE inbox</text>
<text x="58" y="395" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">Only the source lens and query change.</text>
<text x="58" y="422" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">No lifecycle mutation occurs.</text>
<text x="828" y="202" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">parser-cleanup  |  Local archive</text>
<text x="828" y="229" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Main / Reply  [ impl ]</text>
<text x="828" y="256" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7"></text>
<text x="828" y="283" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">“Simplified the parser…”</text>
<text x="828" y="310" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7"></text>
<text x="828" y="337" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Files / Tools / FINAL when retained</text>
<text x="828" y="395" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">Selection loads content lazily.</text>
<text x="828" y="422" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">No read/unread or runner-count side effects.</text>
<text x="58" y="643" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Enter &gt; Actions</text>
<text x="58" y="670" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7"></text>
<text x="58" y="697" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">&gt; Restore to inbox</text>
<text x="58" y="724" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">  Copy agent reference</text>
<text x="58" y="751" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">  Open transcript</text>
<text x="58" y="778" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7"></text>
<text x="58" y="805" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Restore to inbox does not resume execution.</text>
<text x="58" y="844" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">Bulk restore reports restored / skipped / failed.</text>
<text x="58" y="871" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">Stay in History; offer “Show in inbox”.</text>
<text x="828" y="643" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">[ Inbox ] | History</text>
<text x="828" y="670" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7"></text>
<text x="828" y="697" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Prior query: needs:input</text>
<text x="828" y="724" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Prior tab: main</text>
<text x="828" y="751" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">Prior selection: schema-audit</text>
<text x="828" y="778" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7"></text>
<text x="828" y="805" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="18" font-weight="normal" fill="#E7EDF7">“parser-cleanup restored. Show in inbox”</text>
<text x="828" y="844" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">Normal switch restores the parked Inbox.</text>
<text x="828" y="871" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#B3BED0">Show in inbox deliberately reveals the restored run.</text>
<line x1="764" y1="307" x2="797" y2="307" stroke="#79D5DF" stroke-width="2"/>
<line x1="787" y1="301" x2="797" y2="307" stroke="#79D5DF" stroke-width="2"/>
<line x1="787" y1="313" x2="797" y2="307" stroke="#79D5DF" stroke-width="2"/>
<line x1="394" y1="494" x2="394" y2="557" stroke="#79D5DF" stroke-width="2"/>
<line x1="388" y1="547" x2="394" y2="557" stroke="#79D5DF" stroke-width="2"/>
<line x1="400" y1="547" x2="394" y2="557" stroke="#79D5DF" stroke-width="2"/>
<line x1="764" y1="747" x2="797" y2="747" stroke="#79D5DF" stroke-width="2"/>
<line x1="787" y1="741" x2="797" y2="747" stroke="#79D5DF" stroke-width="2"/>
<line x1="787" y1="753" x2="797" y2="747" stroke="#79D5DF" stroke-width="2"/>
<text x="36" y="975" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#B3BED0">A link jump creates a trail entry; Ctrl+O goes back across tabs. ^ restores the prior query.</text>
<text x="36" y="1004" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#B3BED0">Restoration and continuation are separate actions with different effects.</text>
</svg>