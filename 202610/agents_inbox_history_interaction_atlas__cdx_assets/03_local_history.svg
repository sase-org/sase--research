<text x="36" y="886" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#B3BED0">No agent placement strip or tribe tree here. Dates and session groups are browsing aids.</text>
<text x="36" y="915" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#B3BED0">Status (DONE/FAILED), inbox presence (dismissed), and content availability remain separate facts.</text>
