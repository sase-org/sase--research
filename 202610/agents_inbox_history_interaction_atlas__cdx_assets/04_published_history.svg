<text x="668.8" y="366" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" fill="#B3BED0">Current liveness: unknown   |   Owner: athena</text>
<text x="668.8" y="414" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="bold" fill="#79D5DF">Main / Snapshot + Reply</text>
<text x="668.8" y="462" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" fill="#E7EDF7">Published reply content appears here when retained.</text>
<text x="668.8" y="486" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" fill="#E7EDF7">A snapshot does not imply a controllable agent on this host.</text>
