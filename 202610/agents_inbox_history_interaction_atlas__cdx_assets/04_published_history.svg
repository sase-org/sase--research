<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="970" viewBox="0 0 1560 970" role="img"><title>04 / Published history declares its evidence</title><desc>Phase-two concept. Snapshot state is historical evidence, never a remote-control signal.</desc><rect width="100%" height="100%" fill="#0B101A"/>
