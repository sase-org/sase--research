<text x="668.8" y="654" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" fill="#B3BED0">Enter: Copy ref / Open published page / Open transcript</text>
<text x="668.8" y="678" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" fill="#79D5DF">Restore unavailable: no local archive bundle.</text>
<text x="48.0" y="798" dominant-baseline="text-before-edge" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="normal" fill="#B3BED0">j/k move   ,/ filter   ,a Inbox   p deck   ^ prior query   Ctrl+O back</text>
<text x="36" y="886" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#B3BED0">Source: This machine / Published project / Combined. Combined is not called “all agents everywhere”.</text>
<text x="36" y="915" dominant-baseline="text-before-edge" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#B3BED0">Snapshot freshness, synchronization time, and a run’s observation time are different facts.</text>
