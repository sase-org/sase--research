<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="650" viewBox="0 0 1560 650" role="img"><title>01 / One agent destination, two jobs</title><desc>Concept map. Gold = agent destination; text labels carry the distinctions.</desc><rect width="100%" height="100%" fill="#0B101A"/>
